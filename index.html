<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
  </head>
  <body style="background-image: url(https://images.hdqwalls.com/wallpapers/windows-vista-aurora-greeny-in.jpg); background-size: contain; background-repeat: no-repeat; background-position: center;">
    <div id="main">
      <div class="background">
        <div class="window glass active" style="max-width: 600px; --w7-w-bg: #805ba5;">
          <div class="title-bar">
            <div class="title-bar-text">A glass violet window frame</div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button>
              <button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body has-space">
            <p>And even the glass window frame as well.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { Draggable } from 'https://cdn.jsdelivr.net/npm/@neodrag/vanilla@latest/+esm';

      document.querySelectorAll(".window").forEach((win) => {
        new Draggable(win, { handle: ".title-bar" });
        
        win.addEventListener('mousedown', () => {
          document.querySelectorAll(".window").forEach(w => w.style.zIndex = "1");
          win.style.zIndex = "10";
        });
      });
    </script>
  </body>
</html>
